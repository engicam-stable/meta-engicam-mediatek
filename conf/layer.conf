# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "engicam-mediatek"
BBFILE_PATTERN_engicam-mediatek = "^${LAYERDIR}/"
BBFILE_PRIORITY_engicam-mediatek = "9"

LAYERDEPENDS_engicam-mediatek = "rity core mediatek-bsp multimedia-layer"
LAYERSERIES_COMPAT_engicam-mediatek = "scarthgap"
